<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
<style>
.a{animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.fb{transform-box:fill-box}
.draw{stroke-dasharray:1;animation-name:draw}
@keyframes draw{0%{stroke-dashoffset:1}28%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.rise{animation-name:rise}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}22%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{opacity:0;transform:scale(.2)}18%{opacity:1;transform:scale(1.12)}26%,88%{transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
.gy{animation-name:gy;transform-box:fill-box;transform-origin:50% 100%}
@keyframes gy{0%{transform:scaleY(0)}30%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.gx{animation-name:gx;transform-box:fill-box;transform-origin:0 50%}
@keyframes gx{0%{transform:scaleX(0)}30%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.shrink{animation-name:shrink;transform-box:fill-box;transform-origin:0 50%}
@keyframes shrink{0%,10%{transform:scaleX(1)}40%,88%{transform:scaleX(.001)}100%{transform:scaleX(1)}}
.spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stamp{animation-name:stamp;transform-box:fill-box;transform-origin:center}
@keyframes stamp{0%,40%{opacity:0;transform:scale(2.4) rotate(-14deg)}50%{opacity:1;transform:scale(.92) rotate(-14deg)}56%,88%{opacity:1;transform:scale(1) rotate(-14deg)}100%{opacity:0;transform:scale(1) rotate(-14deg)}}
.drive{animation-name:drive}
@keyframes drive{0%{transform:translateX(-260px)}30%,88%{transform:none}100%{transform:translateX(320px)}}
.swing{animation-name:swing;transform-box:view-box;transform-origin:240px 220px}
@keyframes swing{0%{transform:rotate(-80deg)}22%{transform:rotate(20deg)}30%{transform:rotate(-8deg)}36%,88%{transform:rotate(0)}100%{transform:rotate(-80deg)}}
.tick{animation:tick 3s linear infinite;transform-box:view-box}
.drumroll{animation:drumroll 1.6s linear infinite}
.scanline{animation:scanline 3s ease-in-out infinite}
@keyframes scanline{0%,100%{transform:translateY(0)}50%{transform:translateY(190px)}}
.squeeze{animation-name:squeeze;transform-box:fill-box;transform-origin:0 50%}
@keyframes squeeze{0%,15%{transform:none}40%,88%{transform:scale(.62)}100%{transform:none}}
@keyframes drumroll{to{transform:translateX(-40px)}}
@keyframes tick{to{transform:rotate(360deg)}}
.fast{animation-duration:1.2s}
.d1{animation-delay:.25s}.d2{animation-delay:.5s}.d3{animation-delay:.75s}.d4{animation-delay:1s}.d5{animation-delay:1.25s}.d6{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
